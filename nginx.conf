server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Auth gateway (default). Point VITE_DB_WEBDOCKET / VITE_GATEWAY_URL at
    # this nginx host so the SPA never talks to Surreal on :8000.
    location /auth/ {
        proxy_pass http://127.0.0.1:3142/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /alerts {
        proxy_pass http://127.0.0.1:3142;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rpc {
        proxy_pass http://127.0.0.1:3142;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Same-origin proxies for print/tracking: browsers increasingly block a
    # plain-http page from fetching a LAN IP directly (Private Network
    # Access), so these must go through this same nginx host like /auth, /rpc.
    # No trailing slash on proxy_pass: the full path (/print, /print/preview,
    # /tracking) is forwarded unchanged, matching what each service listens on.
    location /print {
        proxy_pass http://127.0.0.1:3132;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tracking {
        proxy_pass http://127.0.0.1:3138;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
